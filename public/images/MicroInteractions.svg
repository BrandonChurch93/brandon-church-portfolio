<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#grid)"/>
  
  <!-- Main title -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="white" text-anchor="middle">
    Micro-Interactions Library
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)" text-anchor="middle">
    15 Production-Ready Copy-Paste Components
  </text>
  
  <!-- Feature cards -->
  <!-- Card 1 -->
  <rect x="200" y="290" width="240" height="140" rx="12" fill="rgba(102, 126, 234, 0.1)" stroke="rgba(102, 126, 234, 0.3)" stroke-width="2"/>
  <text x="320" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
    State Transitions
  </text>
  <text x="320" y="360" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Button Loading
  </text>
  <text x="320" y="385" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Skeleton to Content
  </text>
  <text x="320" y="410" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Toast Notifications
  </text>
  
  <!-- Card 2 -->
  <rect x="480" y="290" width="240" height="140" rx="12" fill="rgba(102, 126, 234, 0.1)" stroke="rgba(102, 126, 234, 0.3)" stroke-width="2"/>
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
    Click Feedback
  </text>
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Ripple Effect
  </text>
  <text x="600" y="385" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Bounce Press
  </text>
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Confetti Burst
  </text>
  
  <!-- Card 3 -->
  <rect x="760" y="290" width="240" height="140" rx="12" fill="rgba(102, 126, 234, 0.1)" stroke="rgba(102, 126, 234, 0.3)" stroke-width="2"/>
  <text x="880" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
    Accessibility
  </text>
  <text x="880" y="360" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Focus Indicators
  </text>
  <text x="880" y="385" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Skip to Content
  </text>
  <text x="880" y="410" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Reduced Motion
  </text>
  
  <!-- Tech stack badges - CENTERED -->
  <!-- Badge 1 - centered at x=420 -->
  <rect x="360" y="480" width="120" height="36" rx="18" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <text x="420" y="503" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">
    Next.js 14
  </text>
  
  <!-- Badge 2 - centered at x=600 -->
  <rect x="540" y="480" width="120" height="36" rx="18" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <text x="600" y="503" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">
    TypeScript
  </text>
  
  <!-- Badge 3 - centered at x=780 -->
  <rect x="720" y="480" width="120" height="36" rx="18" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <text x="780" y="503" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">
    Pure CSS
  </text>
  
  <!-- Bottom accent -->
  <rect x="450" y="560" width="300" height="60" rx="30" fill="url(#accentGrad)"/>
  <text x="600" y="597" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">
    Copy-Paste Ready ✨
  </text>
</svg>
