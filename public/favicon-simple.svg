<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0a0118"/>
  
  <!-- Gradient -->
  <defs>
    <linearGradient id="bc-gradient-simple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3f81" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  
  <!-- Simplified outer ring -->
  <circle
    cx="16"
    cy="16"
    r="13"
    stroke="url(#bc-gradient-simple)"
    stroke-width="1"
    fill="none"
    opacity="0.6"
  />
  
  <!-- BC Text - simplified without effects for clarity at small size -->
  <text
    x="16"
    y="16"
    text-anchor="middle"
    dominant-baseline="central"
    fill="white"
    font-size="11"
    font-weight="bold"
    font-family="system-ui, -apple-system, sans-serif"
    letter-spacing="-0.5"
  >
    BC
  </text>
  
  <!-- Small accent dot -->
  <circle cx="23" cy="9" r="1.5" fill="#ff3f81" />
</svg>